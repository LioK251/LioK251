name: Grow the contribution garden

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/snake.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: contribution-garden
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish the snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub-green snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#216e39
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#39d353

      - name: Verify the generated images
        run: |
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg

      - name: Publish animations to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Refresh contribution garden [skip ci]"
