<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" role="img" aria-labelledby="title description">
  <title id="title">Hi, I'm LioK</title>
  <desc id="description">LioK251 on GitHub. Roblox scripting, music tools, macOS apps, and automation. Building since 2020.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#fff6fa"/>
      <stop offset="1" stop-color="#fbe5ef"/>
    </linearGradient>
    <clipPath id="avatar"><circle cx="240" cy="142" r="49"/></clipPath>
    <g id="blossom" fill="#f3adc8">
      <path d="M0 1C-6-2-7-9-3-10C1-12 2-5 0 1Z"/>
      <path d="M0 1C-6-2-7-9-3-10C1-12 2-5 0 1Z" transform="rotate(72)"/>
      <path d="M0 1C-6-2-7-9-3-10C1-12 2-5 0 1Z" transform="rotate(144)"/>
      <path d="M0 1C-6-2-7-9-3-10C1-12 2-5 0 1Z" transform="rotate(216)"/>
      <path d="M0 1C-6-2-7-9-3-10C1-12 2-5 0 1Z" transform="rotate(288)"/>
      <circle r="2.5" fill="#fff4d5"/>
    </g>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; text-anchor: middle; }
    .petal { animation: drift 10s ease-in-out infinite; }
    .later { animation-delay: -5s; }
    @keyframes drift {
      0%, 100% { transform: translateY(-8px) rotate(-7deg); opacity: .35; }
      50% { transform: translateY(14px) rotate(9deg); opacity: .75; }
    }
    @media (prefers-reduced-motion: reduce) { .petal { animation: none; } }
  </style>
  <rect width="480" height="420" rx="22" fill="url(#background)"/>
  <rect x="14" y="14" width="452" height="392" rx="17" fill="#fffafd" fill-opacity=".65" stroke="#efc9db"/>
  <g fill="none" stroke="#795b4e" stroke-linecap="round">
    <path d="M0 15Q65 50 152 47M480 15Q415 50 328 47" stroke-width="4"/>
    <path d="M59 38Q72 53 67 73M110 46L114 62M421 38Q408 53 413 73M370 46L366 62" stroke-width="2"/>
  </g>
  <use href="#blossom" x="67" y="77"/><use href="#blossom" x="114" y="65"/>
  <use href="#blossom" x="413" y="77"/><use href="#blossom" x="366" y="65"/>
  <text x="240" y="56" font-size="9.5" letter-spacing="3" fill="#996b83">A LITTLE CORNER OF GITHUB</text>
  <circle cx="240" cy="142" r="59" fill="none" stroke="#edb2cb" stroke-dasharray="11 7" stroke-width="2"/>
  <circle cx="240" cy="142" r="53" fill="#fff" stroke="#f1cada" stroke-width="2"/>
  <image x="191" y="93" width="98" height="98" href="data:image/jpeg;base64," clip-path="url(#avatar)" preserveAspectRatio="xMidYMid slice"/>
  <text x="240" y="234" font-size="35" font-weight="700" letter-spacing="2" fill="#48243f">LioK</text>
  <text x="240" y="258" font-size="13" letter-spacing="3" fill="#996b83">@LioK251</text>
  <text x="240" y="291" font-size="14" fill="#634357">I like scripting on Lego games</text>
  <text x="240" y="312" font-size="14" fill="#634357">and building useful little things.</text>
  <g font-size="11" fill="#78395d">
    <rect x="64" y="337" width="111" height="25" rx="12.5" fill="#fae4ee" stroke="#edc0d4"/>
    <text x="119.5" y="354">Roblox scripting</text>
    <rect x="184" y="337" width="105" height="25" rx="12.5" fill="#fae4ee" stroke="#edc0d4"/>
    <text x="236.5" y="354">Music tools</text>
    <rect x="298" y="337" width="118" height="25" rx="12.5" fill="#fae4ee" stroke="#edc0d4"/>
    <text x="357" y="354">macOS apps</text>
  </g>
  <text x="240" y="391" font-size="10" letter-spacing="1.5" fill="#996b83">CURIOUS &amp; BUILDING · SINCE 2020</text>
  <g transform="translate(52 195)"><g class="petal"><use href="#blossom" transform="scale(.65)"/></g></g>
  <g transform="translate(414 261)"><g class="petal later"><use href="#blossom" transform="scale(.8)"/></g></g>
  <g transform="translate(82 284)"><g class="petal later"><ellipse rx="4" ry="8" fill="#f0b0ca" transform="rotate(-25)"/></g></g>
